name: Deploy BMI to Azure

on:
  push:
    branches: [main]
    paths:
      - app.py
      - serve.py
      - web.config
      - requirements.txt
      - templates/**
      - static/**
      - tests/**
      - .github/workflows/deploy-azure.yml
      - .github/workflows/deploy-azure-reusable.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-bmi-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-azure-reusable.yml
    secrets: inherit
