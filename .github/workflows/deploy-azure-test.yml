name: Deploy BMI PR to Azure test slot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: azure-bmi-test
  cancel-in-progress: false

jobs:
  deploy-test:
    uses: ./.github/workflows/deploy-azure-reusable.yml
    with:
      slot_name: test
    secrets: inherit
